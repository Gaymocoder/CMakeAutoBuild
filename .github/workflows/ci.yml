name: CI
on:
  push:
    branches:
    - master
    - stable
  pull_request:
  workflow_dispatch:
jobs:
  build:
    env:
      GCS_WERROR: ON
    strategy:
      fail-fast: false
      matrix:
        include:
        - preset: clang
          os: ubuntu-latest
          build: sh build.sh
        - preset: clang-gcc
          os: ubuntu-latest
          build: sh build.sh
        - preset: clang-mingw
          os: windows-latest
          build: ./build.bat
        - preset: clang-msvc
          os: windows-latest
          build: ./build.bat
        - preset: gcc
          os: ubuntu-latest
          build: sh build.sh
        - preset: mingw32
          os: windows-latest
          build: ./build.bat
        - preset: msvc
          os: windows-latest
          build: ./build.bat
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install conan ruamel.yaml
    - uses: actions/checkout@v4
    - run: conan profile detect --force
    - run: python configure.py
    - run: git diff --exit-code .github/workflows/ci.yml
    - if: ${{ matrix.preset == 'clang' }}
      name: install
      run: |-
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt update
        sudo apt install -y libc++-22-dev libc++abi-22-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-22   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 1000
        sudo update-alternatives --set clang   /usr/bin/clang-22
        sudo update-alternatives --set clang++ /usr/bin/clang++-22
        clang --version
    - if: ${{ matrix.preset == 'clang-gcc' }}
      name: install
      run: |-
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt update
        sudo apt install -y libc++-22-dev libc++abi-22-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-22   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 1000
        sudo update-alternatives --set clang   /usr/bin/clang-22
        sudo update-alternatives --set clang++ /usr/bin/clang++-22
        clang --version
    - if: ${{ matrix.preset == 'clang-gcc' }}
      name: install
      run: |-
        sudo apt update
        sudo apt install -y g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
    - uses: KyleMayes/install-llvm-action@v2
      with:
        version: '20'
      if: ${{ matrix.preset == 'clang-mingw' }}
    - if: ${{ matrix.preset == 'clang-mingw' }}
      name: install
      run: |-
        choco install mingw --version=14.2.0 -y
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
      shell: pwsh
    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ matrix.preset == 'clang-msvc' }}
    - uses: KyleMayes/install-llvm-action@v2
      with:
        version: '20'
      if: ${{ matrix.preset == 'clang-msvc' }}
    - if: ${{ matrix.preset == 'gcc' }}
      name: install
      run: |-
        sudo apt update
        sudo apt install -y g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
    - if: ${{ matrix.preset == 'mingw32' }}
      name: install
      run: |-
        choco install mingw --version=14.2.0 -y
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
      shell: pwsh
    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ matrix.preset == 'msvc' }}
    - name: Build
      run: ${{ matrix.build }} ${{ matrix.preset }}
    - name: Log results
      if: always()
      shell: bash
      run: echo "${{ matrix.preset }} ${{ job.status }}" > r-${{ matrix.preset 
        }}.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ci-result-${{ matrix.preset }}
        path: r-${{ matrix.preset }}.txt
  notes:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: ci-result-*
        merge-multiple: true
        path: results
    - name: Record notes
      run: |
        cat results/*.txt | tr -d '\r' | sort \
        | awk '{
            if      ($2 == "success") mark = "✓"
            else if ($2 == "failure") mark = "✗"
            else                      mark = "? (" $2 ")"
            printf "%-13s %s\n", $1, mark
          }' > verdict.txt
        ls -la results/
        echo "--- collected ---"
        cat results/*.txt
        echo "--- verdict ---"
        cat verdict.txt
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git fetch origin "refs/notes/ci:refs/notes/ci" || true
        git notes --ref=ci add -f -F verdict.txt ${{ github.sha }}
        git push origin refs/notes/ci
