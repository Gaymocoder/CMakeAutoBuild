name: CI
on:
  push:
    branches:
    - master
    - stable
  pull_request:
  workflow_dispatch:
jobs:
  build:
    env:
      GCS_WERROR: ON
    strategy:
      fail-fast: false
      matrix:
        include:
        - preset: clang
          os: ubuntu-latest
          build: sh build.sh
        - preset: clang-gcc
          os: ubuntu-latest
          build: sh build.sh
        - preset: clang-mingw
          os: windows-latest
          build: ./build.bat
        - preset: clang-msvc
          os: windows-latest
          build: ./build.bat
        - preset: gcc
          os: ubuntu-latest
          build: sh build.sh
        - preset: mingw32
          os: windows-latest
          build: ./build.bat
        - preset: msvc
          os: windows-latest
          build: ./build.bat
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install conan ruamel.yaml
    - run: conan profile detect --force
    - uses: actions/checkout@v4
    - run: python configure.py
    - if: ${{ matrix.preset == 'clang' }}
      name: install
      run: |-
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt update
        sudo apt install -y libc++-22-dev libc++abi-22-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-22   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 1000
        sudo update-alternatives --set clang   /usr/bin/clang-22
        sudo update-alternatives --set clang++ /usr/bin/clang++-22
        clang --version
    - if: ${{ matrix.preset == 'clang-gcc' }}
      name: install
      run: |-
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt update
        sudo apt install -y libc++-22-dev libc++abi-22-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-22   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 1000
        sudo update-alternatives --set clang   /usr/bin/clang-22
        sudo update-alternatives --set clang++ /usr/bin/clang++-22
        clang --version
    - if: ${{ matrix.preset == 'clang-gcc' }}
      name: install
      run: |-
        sudo apt update
        sudo apt install -y g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
    - uses: KyleMayes/install-llvm-action@v2
      with:
        version: '20'
      if: ${{ matrix.preset == 'clang-mingw' }}
    - if: ${{ matrix.preset == 'clang-mingw' }}
      name: install
      run: |-
        choco install mingw --version=14.2.0 -y
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
      shell: pwsh
    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ matrix.preset == 'clang-msvc' }}
    - uses: KyleMayes/install-llvm-action@v2
      with:
        version: '20'
      if: ${{ matrix.preset == 'clang-msvc' }}
    - if: ${{ matrix.preset == 'gcc' }}
      name: install
      run: |-
        sudo apt update
        sudo apt install -y g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
    - if: ${{ matrix.preset == 'mingw32' }}
      name: install
      run: |-
        choco install mingw --version=14.2.0 -y
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
      shell: pwsh
    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ matrix.preset == 'msvc' }}
    - name: Build
      run: ${{ matrix.build }} ${{ matrix.preset }}
